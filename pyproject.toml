[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "outward_assembly"
version = "0.1.0"
description = "Assembly tool for growing contigs outward from a seed sequence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "networkx~=3.4.2",
    "biopython~=1.84",
    "boto3~=1.35.81",
    "python-dotenv~=1.0.1",
    "pyyaml~=6.0.2",
    "smart_open[s3,gcs]~=7.0.4",
    "google-cloud-storage~=2.14.0",
]

[project.optional-dependencies]
dev = [
    "black",
    "pytest~=8.3.4",
    "ruff",
    "ipython",
    "pytest-mock~=3.14.0",
    "pytest-cov~=4.1.0",
]

[tool.pytest.ini_options]
markers = [
    "unit: Fast unit tests (always run)",
    "fast: Very fast tests (<1s)",
    "integration: Integration tests (may be slow)",
    "requires_cloud: Requires cloud credentials (S3/GCS/Azure)",
    "requires_tools: Requires bioinformatics tools (BBDuk, KMC, etc.)",
    "slow: Slow tests (>10s)",
    "benchmark: Performance benchmarks",
]

[tool.setuptools]
packages = ["outward_assembly"]

[tool.black]
line-length = 92

[tool.ruff.lint]
select = [
    "E",     # Pycodestyle
    "F",     # Pyflakes  
    "I",     # isort
    "PERF",  # Performance anti-patterns
]
ignore = [
    "E203",  # Whitespace before ':' (use black's style)
    "E501",  # Line too long (let black handle this)
]

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["osx-arm64"]

[tool.pixi.pypi-dependencies]
outward_assembly = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]

[tool.pixi.dependencies]
nextflow = ">=25.10.2,<26"
s5cmd = ">=2.3.0,<3"
bbmap = ">=39.52,<40"
kmc = ">=3.2.4,<4"
megahit = ">=1.2.9,<2"
